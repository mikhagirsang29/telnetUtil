services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-telnet_central}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Uncomment to reach Postgres from the host (psql, DBeaver, ...):
    # ports:
    #   - "127.0.0.1:5432:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    # These win over .env, so the same .env also works for `go run .` on your machine.
    environment:
      LISTEN_ADDR: ":8080"
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
